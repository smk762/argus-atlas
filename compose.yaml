# argus-atlas in Docker: the CLI and the API from one image, the host-specific parts in .env.
#
#   cp .env.example .env                                  # then edit paths, UID/GID, flags
#   docker compose run --rm atlas doctor                  # any CLI command: `atlas` is argus-atlas
#   docker compose up -d serve                            # the API on 127.0.0.1:8105
#   docker compose --profile test run --rm test           # the suite against real GDAL
#   docker compose build                                  # after a pull: run/up never rebuild an existing image
#
# Settings every Argus service on the host shares (the GPU broker's URL and token, ARGUS_COMFYUI_URL) can live in
# the suite file, ~/.config/argus/suite.env (mode 600), instead of .env. Compose has no optional bind mount, so the
# mount is its own file, compose.suite.yaml: add it only on a host that has the suite file (see that file).
#
# ComfyUI is not managed here: it runs on the GPU host and is reached by URL. argus-studio
# deploys atlas through its own compose (`--profile atlas`); this file is for operators and dev.
# Paths given to the CLI are container paths: /data/dem, /data/recipes, /data/models, /data/out/atlas.
name: argus-atlas

x-atlas: &atlas
  image: ${ATLAS_IMAGE:-argus-atlas:local}
  build:
    context: .
    args:
      EXTRAS: server,cli,tiles
  # Files written to the mounts belong to you, not root. Bash does not export UID, so set it in .env.
  user: "${UID:-1000}:${GID:-1000}"
  extra_hosts:
    - host.docker.internal:host-gateway
  environment: &atlas-env
    HOME: /tmp
    # Unset or empty means argus_atlas.config's default (comfyui, host.docker.internal:8188, ...). An empty
    # COMFYUI_BASE_URL or ARGUS_GPU_BROKER_* also falls through to the suite file when it is mounted.
    ATLAS_BACKEND: ${ATLAS_BACKEND:-}
    COMFYUI_BASE_URL: ${COMFYUI_BASE_URL:-}
    ATLAS_WORKFLOW: ${ATLAS_WORKFLOW:-}  # a container path, e.g. under /data/models
    ATLAS_ALLOW_BAKE: ${ATLAS_ALLOW_BAKE:-}
    ATLAS_ALLOW_OSM: ${ATLAS_ALLOW_OSM:-}
    ATLAS_ALLOW_DELETE: ${ATLAS_ALLOW_DELETE:-${DEVMODE:-}}  # POST /purge; follows DEVMODE unless set
    ATLAS_CORS_ORIGINS: ${ATLAS_CORS_ORIGINS:-}
    ATLAS_DEM_SOURCE: ${ATLAS_DEM_SOURCE:-}
    ATLAS_OVERPASS_URL: ${ATLAS_OVERPASS_URL:-}
    ATLAS_RECIPES_DIR: /data/recipes
    # GPU leases (argus-iris broker): the URL alone switches them on (unset is no gating); the tenant manifest is
    # the image's /app/gpu-tenant.yaml, which argus-cortex finds by itself.
    ARGUS_GPU_BROKER_URL: ${ARGUS_GPU_BROKER_URL:-}
    ARGUS_GPU_BROKER_TOKEN: ${ARGUS_GPU_BROKER_TOKEN:-}
    ARGUS_GPU_BROKER_FALLBACK: ${ARGUS_GPU_BROKER_FALLBACK:-}
    ARGUS_GPU_LEASE_TIMEOUT_S: ${ARGUS_GPU_LEASE_TIMEOUT_S:-}  # how long a lease may wait in iris's queue
    ATLAS_GPU_PRIORITY: ${ATLAS_GPU_PRIORITY:-}  # batch unless set; background for a long re-bake
  # Long syntax with create_host_path: false, so a mistyped *_HOST path fails the run instead of
  # docker creating an empty root-owned directory that the container (your uid) cannot write.
  volumes:
    - {type: bind, source: "${ATLAS_DEM_HOST:-./data/dem}", target: /data/dem, bind: {create_host_path: false}}
    - type: bind
      source: "${ATLAS_RECIPES_HOST:-./examples/recipes}"
      target: /data/recipes
      read_only: true
      bind: {create_host_path: false}
    - type: bind
      source: "${ATLAS_MODELS_HOST:-./data/models}"
      target: /data/models
      read_only: true
      bind: {create_host_path: false}
    - {type: bind, source: "${ATLAS_JOBS_HOST:-./data/jobs}", target: /data/out/atlas, bind: {create_host_path: false}}

services:
  atlas:  # nosemgrep: service-peer-label  one-shot CLI (`compose run --rm atlas`, profile cli), serves nothing
    <<: *atlas
    profiles: [cli]  # one-shot: `docker compose run --rm atlas <command>`; never started by `up`
    entrypoint: [argus-atlas]
    command: [--help]

  serve:
    <<: *atlas
    command: [argus-atlas, serve, --port, "8105", --cors]
    environment:
      <<: *atlas-env
      # The peer label below, reported back in GET /health: a process cannot read its own labels.
      ARGUS_PEER: atlas
    ports:
      - ${ATLAS_BIND:-127.0.0.1}:${ATLAS_PORT:-8105}:8105
    restart: unless-stopped
    # How the suite finds this service: argus-iris's agents read the labels and build its directory from them.
    labels:
      argus.peer: atlas
      argus.service: argus-atlas
      argus.health: /health
      argus.port: "8105"
    healthcheck:
      # checks=0: liveness only, without asking GDAL or ComfyUI.
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8105/health?checks=0', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
      start_interval: 2s

  test:  # nosemgrep: service-peer-label  test container (profile test): runs pytest against real GDAL, then exits
    image: argus-atlas:test
    build:
      context: .
      args:
        EXTRAS: server,cli,tiles,dev
    profiles: [test]
    user: "${UID:-1000}:${GID:-1000}"
    working_dir: /src
    environment:
      HOME: /tmp
      PYTHONPATH: /src/src  # the checkout, not the copy baked into the image
      PYTHONDONTWRITEBYTECODE: "1"  # keep the checkout free of container-written caches
      ATLAS_TEST_REQUIRE_GDAL: "1"
    volumes:
      - .:/src
    command: [python, -m, pytest, -q, -p, no:cacheprovider]
