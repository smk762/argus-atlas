# Optional: mount the suite settings file (argus_cortex.settings) into the atlas containers, read-only.
#
#   python -m argus_cortex.settings --init                # creates ~/.config/argus/suite.env, mode 600
#   COMPOSE_FILE=compose.yaml:compose.suite.yaml          # in .env, or pass both files with -f
#
# A separate file because compose cannot make a bind mount optional: with it in compose.yaml, a host without a
# suite file would not start. The file must belong to the uid the container runs as (UID in .env) or to root, and
# be mode 600; argus-cortex ignores it with a warning otherwise. Anything set in .env or the environment still wins.
x-suite-env: &suite-env
  type: bind
  source: "${ARGUS_SUITE_ENV:-${HOME}/.config/argus/suite.env}"
  target: /etc/argus/suite.env
  read_only: true
  bind: {create_host_path: false}

services:
  atlas:
    volumes:
      - *suite-env
  serve:
    volumes:
      - *suite-env
