# argus-iris GPU tenant manifest for argus-atlas (#54).
# Validated by argus-cortex's TenantManifest (gpu-tenant-schema.json, tenant_version 1.0); tests/test_gpu.py fails if
# it stops validating or drifts from the figures in src/argus_atlas/gpu.py.
#
# With ARGUS_GPU_BROKER_URL set, `argus-atlas serve` registers this with the broker at startup (the CLI with its first
# lease). argus-cortex finds it in the working directory or at /app/gpu-tenant.yaml, where the Docker image ships it.
# Tokens never go here: ARGUS_GPU_BROKER_TOKEN lives in the host's .env.
#
# VRAM figures are MiB. The broker uses its learned p95 per kind when that is larger, so a heavier checkpoint or a
# larger ControlNet is caught after a few leases.
tenant: argus-atlas
description: Bakes a georeferenced fantasy-map overlay from real terrain, one canvas or chunk per ComfyUI prompt.
repo: smk762/argus-atlas

kinds:
  # One canvas (bake, chunk, POST /bake/stream), or a block of chunks (chunks) under one lease. Batch work that
  # yields between tiles: when the broker asks for the GPU back, atlas releases it before the next chunk is painted
  # and queues again on the same node. A prompt already in ComfyUI runs to the end.
  - kind: bake
    target: comfyui
    vram_mb: 12000
    model_mb: 9000 # the SDXL checkpoint + SDXL ControlNet, which stay loaded in ComfyUI
    priority: batch
    preemptible: true
    description: A canvas or a block of chunks painted by ComfyUI, one tile per prompt.

# Atlas keeps no model loaded itself: ComfyUI holds the weights and declares them in its own manifest.
residents: []
